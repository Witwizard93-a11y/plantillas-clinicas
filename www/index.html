<!DOCTYPE html>
<html lang="es" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Plantillas Clínicas</title>
<meta name="description" content="Plantillas clínicas, calculadora NEWS2, códigos IAM e Ictus, algoritmos de RCP y abordaje ABCDE para medicina de familia y urgencias.">
<meta name="theme-color" content="#F3F6F5">
<meta name="color-scheme" content="light dark">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
<script>
  (function () {
    try {
      var t = localStorage.getItem('pc2.tema') || 'auto';
      var oscuro = t === 'oscuro' || (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-tema', oscuro ? 'oscuro' : 'claro');
    } catch (e) {}
  })();
</script>
</head>
<body>
<div class="app">
  <aside class="rail" aria-label="Secciones">
    <a class="marca" href="#/inicio">
      <span class="marca-nombre">Plantillas<br>Clínicas</span>
    </a>
    <nav class="rail-nav" id="railNav"></nav>
    <button type="button" class="rail-item rail-tema" id="botonTema"></button>
  </aside>

  <main class="principal" id="principal" tabindex="-1"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- contenido -->
<script src="contenido/news2.js"></script>
<script src="contenido/news.js"></script>
<script src="contenido/abcde.js"></script>
<script src="contenido/rcp.js"></script>
<script src="contenido/iam.js"></script>
<script src="contenido/ictus.js"></script>
<script src="contenido/sepsis.js"></script>
<script src="contenido/ppt.js"></script>
<script src="contenido/suicidio.js"></script>
<script src="contenido/urgped.js"></script>
<script src="contenido/plantillas.js"></script>
<!-- /contenido -->
<script src="js/app.js"></script>
</body>
</html>
