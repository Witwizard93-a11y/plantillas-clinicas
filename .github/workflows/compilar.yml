# Compila la web/PWA, el APK de Android y el instalador de Windows en cada
# cambio de la rama main. Los archivos quedan en Actions > (ejecución) > Artifacts.
# Una etiqueta v1.2.3 crea además una Release con todos los archivos.
name: Compilar apps

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: compilar-${{ github.ref }}
  cancel-in-progress: true

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web
      - uses: actions/upload-artifact@v4
        with:
          name: archivo-unico-html
          path: dist/PlantillasClinicas.html

  publicar-web:
    # Requiere Settings > Pages > Source: GitHub Actions. Si no usas Pages, ignora este paso.
    needs: web
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4

  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: node scripts/build.mjs && npx cap sync android
      - name: APK firmado (con los secretos del repositorio)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/firma.jks"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/firma.jks"
          cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
          mkdir -p ../salida && cp app/build/outputs/apk/release/app-release.apk "../salida/PlantillasClinicas-${GITHUB_REF_NAME//\//-}.apk"
      - name: APK de prueba (sin secretos de firma)
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: |
          echo "::warning::Sin secretos de firma: se genera un APK de depuración que no se podrá actualizar encima del firmado."
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
          mkdir -p ../salida && cp app/build/outputs/apk/debug/app-debug.apk ../salida/PlantillasClinicas-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: salida/*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/windows/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [web, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: archivos
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: archivos
      - uses: actions/download-artifact@v4
        with:
          name: archivo-unico-html
          path: archivos
      - uses: softprops/action-gh-release@v2
        with:
          files: archivos/*
